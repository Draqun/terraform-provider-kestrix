stages:
  - analysis
  - test
  - build
  - release

default:
  image: golang:1.25-alpine
  before_script:
    - apk add --no-cache bash git make gcc musl-dev

# ─── Analysis ───────────────────────────────────────────────

fmt-check:
  stage: analysis
  script:
    - make fmt-check

vet:
  stage: analysis
  script:
    - make vet

staticcheck:
  stage: analysis
  # The Makefile owns the pinned staticcheck version so CI and local runs
  # cannot drift apart.
  script:
    - make staticcheck

version-verification:
  stage: analysis
  image: python:3.13-alpine
  rules:
    - if: '$CI_COMMIT_TAG'
      when: always
    - when: never
  before_script:
    - apk add --no-cache git
  script:
    - python3 scripts/verify_version.py --tag "$CI_COMMIT_TAG" --strict

version-bump-check:
  stage: analysis
  image: python:3.13-alpine
  allow_failure: true
  rules:
    - if: '$SKIP_VERSION_BUMP_CHECK == "true"'
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip version-check\]/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - when: never
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
  script:
    - python3 scripts/verify_version_bump.py --target-ref "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"

# ─── Test ───────────────────────────────────────────────────

coverage:
  stage: test
  script:
    - make coverage
  coverage: '/Coverage:\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage.out
    expire_in: 7 days

protocol:
  stage: test
  before_script:
    - apk add --no-cache bash git make gcc musl-dev curl unzip
    - wget -qO /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
    - unzip -q /tmp/terraform.zip -d /usr/local/bin
  script:
    - make protocol
    - make docs

# ─── Build ──────────────────────────────────────────────────

cross-build:
  stage: build
  before_script:
    - apk add --no-cache bash make zip
  script:
    - make dist VERSION="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
  artifacts:
    paths:
      - dist/provider/
    expire_in: 30 days

# ─── Release ────────────────────────────────────────────────

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: cross-build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  before_script:
    - apk add --no-cache python3 tar
  script:
    - test -n "${CI_JOB_TOKEN}"
    - test -f "dist/provider/${CI_COMMIT_TAG}/SHA256SUMS"
    - sha256sum -c "dist/provider/${CI_COMMIT_TAG}/SHA256SUMS"
    - tar -czf "provider-${CI_COMMIT_TAG}.tar.gz" -C "dist/provider/${CI_COMMIT_TAG}" .
    - python3 scripts/generate_release_notes.py --version "${CI_COMMIT_TAG}" --output release-notes.md
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'Kestrix provider $CI_COMMIT_TAG'
    description: './release-notes.md'
    assets:
      links:
        - name: 'Provider artifacts'
          url: '${CI_JOB_URL}/artifacts/download'
  artifacts:
    paths:
      - provider-${CI_COMMIT_TAG}.tar.gz
      - dist/provider/${CI_COMMIT_TAG}/
      - release-notes.md
    expire_in: 1 year

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
    - when: never
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache python3 git curl jq
  script:
    - |
      VERSION=$(python3 -c "import re; m = re.search(r'^##\s+\[([0-9]+\.[0-9]+\.[0-9]+[^\]]*)\]', open('CHANGELOG.md').read(), re.M); print(m.group(1)) if m else exit(1)")
      TAG="v$VERSION"
      echo "Creating release for version: $VERSION (tag: $TAG)"

      if git rev-parse "$TAG" >/dev/null 2>&1; then
        echo "Tag $TAG exists locally"
        LOCAL_TAG_EXISTS=true
      else
        echo "Tag $TAG does not exist locally"
        LOCAL_TAG_EXISTS=false
      fi

      if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
        echo "Tag $TAG already exists on remote origin. Release already cut."
        exit 0
      fi

      echo "Creating tag $TAG"
      git config --global user.email "gitlab-ci@gitlab.com"
      git config --global user.name "GitLab CI"

      if [ "$LOCAL_TAG_EXISTS" = "true" ]; then
        git tag -d "$TAG"
      fi

      git tag -a "$TAG" -m "Release $TAG"

      if [ -n "$CI_RELEASE_TOKEN" ]; then
        git remote set-url origin "https://gitlab-ci-token:${CI_RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
        git push origin "$TAG"
        echo "Tag $TAG pushed successfully"
      elif [ -n "$CI_JOB_TOKEN" ]; then
        git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
        git push origin "$TAG" || echo "Tag push with CI_JOB_TOKEN failed (configure CI_RELEASE_TOKEN in Project Settings -> CI/CD -> Variables)."
      else
        echo "WARNING: CI_RELEASE_TOKEN not configured. Please add CI_RELEASE_TOKEN in Project Settings to allow automated tag push."
        exit 1
      fi

sign:
  stage: release
  image: ghcr.io/sigstore/cosign:v2.4.1
  before_script: []
  needs:
    - job: cross-build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $COSIGN_PRIVATE_KEY'
  script:
    - test -n "${COSIGN_PRIVATE_KEY}"
    - cd "dist/provider/${CI_COMMIT_TAG}"
    - sha256sum -c SHA256SUMS
    - cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY --output-signature SHA256SUMS.sig --output-certificate SHA256SUMS.pem SHA256SUMS
    - cosign verify-blob --key env://COSIGN_PUBLIC_KEY --signature SHA256SUMS.sig --certificate SHA256SUMS.pem SHA256SUMS
  artifacts:
    paths:
      - dist/provider/${CI_COMMIT_TAG}/SHA256SUMS*
    expire_in: 1 year

registry-publish:
  stage: release
  image: alpine:3.20
  before_script: []
  needs:
    - job: release
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $KESTRIX_REGISTRY_PUBLISH == "1"'
      when: manual
  script:
    - test -n "${KESTRIX_REGISTRY_UPLOAD_URL}"
    - test -n "${KESTRIX_REGISTRY_TOKEN}"
    - apk add --no-cache curl
    - >-
      curl --fail-with-body --header "JOB-TOKEN: ${KESTRIX_REGISTRY_TOKEN}"
      --upload-file "provider-${CI_COMMIT_TAG}.tar.gz"
      "${KESTRIX_REGISTRY_UPLOAD_URL}/${CI_COMMIT_TAG}/provider-${CI_COMMIT_TAG}.tar.gz"
